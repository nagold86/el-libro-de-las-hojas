[project]
name = "fellowship"
version = "0.2.1"
description = "Analisis de hojas de tabaco con procesamiento de imagenes clasico"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "python-multipart>=0.0.9,<1",
    "opencv-python-headless>=4.10,<6",
    "numpy>=2.0,<3",
    "scipy>=1.13,<2",
    "pandas>=2.2,<3",
    "pillow>=10.4,<13",
    # Registro en Postgres (ADR-016). El driver se importa dentro de app/db,
    # así el modo archivos funciona aunque no esté instalado.
    "psycopg[binary]>=3.2,<4",
    "psycopg-pool>=3.2,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
    "pytest-cov>=5.0,<8",
    "httpx>=0.27,<1",
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
    "slow: pruebas con imagenes reales del dataset",
]
# Los tests de Postgres usan la base de docker-compose (puerto 5433) y se
# saltean solos si no está levantada.

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
files = ["core", "app"]
ignore_missing_imports = true
